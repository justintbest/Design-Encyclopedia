<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Encyclopedia</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        oklch(0.155 0.006 265);
    --bg-2:      oklch(0.195 0.007 265);
    --bg-3:      oklch(0.235 0.008 265);
    --line:      oklch(0.32 0.008 265 / 0.6);
    --line-soft: oklch(0.32 0.008 265 / 0.28);
    --fg:        oklch(0.955 0.004 265);
    --fg-2:      oklch(0.70 0.007 265);
    --fg-3:      oklch(0.55 0.008 265);
    --accent:    oklch(0.76 0.12 62);
    --accent-dim:oklch(0.76 0.12 62 / 0.18);
    --sans: 'Space Grotesk', system-ui, sans-serif;
    --mono: 'Space Mono', ui-monospace, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  ::selection { background: var(--accent-dim); color: var(--fg); }

  .wrap { width: 100%; max-width: 1400px; margin: 0 auto; padding: 0 clamp(16px, 3vw, 32px); }

  .mono-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--fg-3);
  }

  /* ---------- NAV ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: oklch(0.155 0.006 265 / 0.92);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line-soft);
  }
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    height: 68px;
  }
  .brand {
    display: flex;
    flex-direction: column;
    gap: 3px;
    text-decoration: none;
    color: var(--fg);
    flex-shrink: 0;
  }
  .brand .mark {
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 0.22em;
  }
  .brand .dot { width: 7px; height: 7px; background: var(--accent); display: inline-block; transform: translateY(-2px); flex-shrink: 0; }
  .brand .byline {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--fg-3);
  }

  .nav-search {
    flex: 1;
    max-width: 420px;
    position: relative;
  }
  .nav-search input {
    width: 100%;
    background: var(--bg-2);
    border: 1px solid var(--line-soft);
    color: var(--fg);
    font-family: var(--mono);
    font-size: 13px;
    padding: 10px 14px 10px 34px;
    letter-spacing: 0.02em;
    transition: border-color 0.2s;
  }
  .nav-search input:focus { outline: none; border-color: var(--accent); }
  .nav-search input::placeholder { color: var(--fg-3); }
  .nav-search svg {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    color: var(--fg-3); pointer-events: none;
  }
  .nav-count {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--fg-3);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .nav-count b { color: var(--fg); font-weight: 700; }

  @media (max-width: 720px) {
    .brand .byline { display: none; }
    .nav-count { display: none; }
  }
  @media (max-width: 540px) {
    .brand .mark { font-size: 16px; letter-spacing: 0.16em; }
    .nav { gap: 12px; }
  }

  /* ---------- FILTERS ---------- */
  .controls {
    position: sticky;
    top: 68px;
    z-index: 40;
    background: oklch(0.155 0.006 265 / 0.96);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line-soft);
    padding: 16px 0;
  }
  .controls-row { display: flex; align-items: center; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .filters[hidden] { display: none; }
  .filter {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-2);
    background: none;
    border: 1px solid var(--line-soft);
    padding: 7px 13px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
  }
  .filter .fdot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 7px; background: var(--cat-color, var(--accent)); flex-shrink: 0; }
  .filter .c { color: var(--fg-3); margin-left: 6px; }
  .filter:hover { color: var(--fg); border-color: var(--line); }
  .filter.active { color: var(--bg); background: var(--fg); border-color: var(--fg); }
  .filter.active .c { color: oklch(0.155 0.006 265 / 0.6); }

  .sortgroup { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .sortbtns { display: flex; gap: 6px; }
  .sortbtns button, .shuffle-btn {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-2);
    background: none;
    border: 1px solid var(--line-soft);
    padding: 6px 12px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .sortbtns button:hover { color: var(--fg); border-color: var(--line); }
  .sortbtns button.active { color: var(--bg); background: var(--fg); border-color: var(--fg); }
  .shuffle-btn { color: var(--accent); border-color: var(--accent); }
  .shuffle-btn:hover { background: var(--accent-dim); }
  .shuffle-btn[hidden] { display: none; }
  .sortgroup .divider { width: 1px; height: 18px; background: var(--line-soft); margin: 0 2px; }
  .viewtab {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-2);
    background: none;
    border: 1px solid var(--line-soft);
    padding: 6px 12px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .viewtab:hover { color: var(--fg); border-color: var(--accent); }
  .viewtab.active { color: var(--bg); background: var(--accent); border-color: var(--accent); }

  /* ---------- BRIEF BUILDER ---------- */
  .briefbuilder { padding: clamp(28px, 4vw, 48px) 0 80px; }
  .brief-card {
    background: var(--bg-2);
    border: 1px solid var(--line);
    padding: clamp(28px, 5vw, 56px) clamp(20px, 5vw, 40px);
    text-align: center;
    max-width: 780px;
    margin: 0 auto;
  }
  .brief-text {
    font-size: clamp(22px, 3.6vw, 36px);
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.35;
    color: var(--fg);
    margin: 18px 0 30px;
    min-height: 2.7em;
    display: flex;
    align-items: center;
    justify-content: center;
    text-wrap: balance;
  }
  .brief-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .brief-btn {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 13px 24px;
    cursor: pointer;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--bg);
    font-weight: 700;
    transition: all 0.2s;
  }
  .brief-btn:hover { background: oklch(0.82 0.13 62); border-color: oklch(0.82 0.13 62); }
  .brief-btn.ghost { background: none; color: var(--fg-2); border-color: var(--line); font-weight: 400; }
  .brief-btn.ghost:hover { color: var(--fg); border-color: var(--accent); }
  .brief-note { margin-top: 16px; color: var(--fg-3); }
  .brief-history { margin: 32px auto 0; max-width: 640px; display: flex; flex-direction: column; gap: 6px; }
  .brief-history .item {
    font-family: var(--mono); font-size: 12px; color: var(--fg-3);
    padding: 8px 12px; border-left: 2px solid var(--line-soft);
    background: var(--bg-2);
  }

  /* ---------- GRID ---------- */
  main { padding: clamp(24px, 3vw, 36px) 0 80px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 1px;
    background: var(--line-soft);
    border: 1px solid var(--line-soft);
  }
  .term-cell {
    position: relative;
    background: var(--bg-2);
    border-left: 3px solid var(--cat-color, var(--accent));
    padding: 9px 12px;
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    min-height: 38px;
  }
  .term-cell:hover { background: var(--bg-3); z-index: 2; }
  .term-cell .t { font-size: 12.5px; font-weight: 500; line-height: 1.3; letter-spacing: -0.005em; }
  .empty {
    padding: 60px 0;
    text-align: center;
    color: var(--fg-3);
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    grid-column: 1 / -1;
    background: var(--bg);
  }

  /* ---------- TOOLTIP ---------- */
  #tooltip {
    position: fixed;
    left: 0; top: 0;
    z-index: 200;
    width: 300px;
    max-width: calc(100vw - 24px);
    background: var(--bg-3);
    border: 1px solid var(--line);
    border-left: 3px solid var(--cat-color, var(--accent));
    padding: 12px 14px;
    box-shadow: 0 12px 32px oklch(0.05 0.006 265 / 0.55);
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.12s ease, transform 0.12s ease;
    pointer-events: none;
  }
  #tooltip.show { opacity: 1; transform: translateY(0); }
  #tooltip .cat {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--cat-color, var(--accent)); display: block; margin-bottom: 6px;
  }
  #tooltip .term { font-weight: 700; font-size: 14.5px; color: var(--fg); display: block; margin-bottom: 6px; letter-spacing: -0.01em; }
  #tooltip .def { font-size: 13px; line-height: 1.55; color: var(--fg-2); }
  @media (hover: none) { #tooltip { display: none; } }

  /* ---------- FOOTER ---------- */
  footer { border-top: 1px solid var(--line-soft); padding: 40px 0; }
  .foot {
    display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px;
  }
  .foot-label { font-size: 11px; letter-spacing: 0.18em; color: var(--fg-3); }
  .foot-copy { font-size: 11px; color: var(--fg-3); }
  .foot-copy code {
    font-family: var(--mono); background: var(--bg-2); padding: 2px 6px; border: 1px solid var(--line-soft);
    color: var(--fg-2); font-size: 11px;
  }

  /* ---------- LIGHTBOX (entry detail) ---------- */
  .lb {
    position: fixed; inset: 0; z-index: 100;
    background: oklch(0.10 0.006 265 / 0.96);
    backdrop-filter: blur(8px);
    display: none;
    overflow-y: auto;
    padding: clamp(20px, 5vw, 72px);
    padding-top: clamp(60px, 8vw, 100px);
  }
  .lb.open { display: block; }
  .lb-inner { width: min(760px, 100%); margin: 0 auto; padding-bottom: 80px; }
  .lb-bar { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 22px; gap: 24px; }
  .lb-bar .cat {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--cat-color, var(--accent)); cursor: pointer; text-decoration: none; display: inline-block; margin-bottom: 10px;
  }
  .lb-bar .cat:hover { text-decoration: underline; }
  .lb-bar .t { font-size: clamp(26px, 4vw, 36px); font-weight: 600; letter-spacing: -0.01em; line-height: 1.1; }
  .lb-nav { display: flex; gap: 10px; flex-shrink: 0; }
  .lb-btn {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em;
    color: var(--fg); background: none; border: 1px solid var(--line);
    width: 44px; height: 44px; cursor: pointer; transition: all 0.2s;
  }
  .lb-btn:hover { border-color: var(--accent); color: var(--accent); }
  .lb-close {
    position: absolute; top: clamp(18px,4vw,34px); right: clamp(18px,4vw,34px);
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em;
    color: var(--fg-2); background: none; border: 1px solid var(--line);
    padding: 10px 16px; cursor: pointer; transition: all 0.2s;
  }
  .lb-close:hover { color: var(--fg); border-color: var(--accent); }
  .lb-stage {
    background-color: var(--bg-2);
    border: 1px solid var(--line);
    padding: clamp(24px, 4vw, 40px);
  }
  .lb-stage .def { font-size: clamp(16px, 1.9vw, 19px); line-height: 1.65; color: var(--fg); text-wrap: pretty; }
  .lb-related { margin-top: 28px; }
  .lb-related .h { margin-bottom: 12px; }
  .lb-related .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .lb-related .chip {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em;
    color: var(--fg-2); border: 1px solid var(--line-soft); padding: 6px 12px;
    cursor: pointer; background: none; transition: all 0.2s;
  }
  .lb-related .chip:hover { color: var(--fg); border-color: var(--accent); }

  @media (max-width: 540px) {
    .lb { padding: 16px; padding-top: 56px; }
    .lb-close { top: 12px; right: 12px; padding: 8px 12px; font-size: 11px; }
    .lb-bar { flex-direction: column; gap: 14px; }
    .lb-nav { align-self: flex-end; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="#" class="brand" onclick="event.preventDefault(); window.scrollTo({top:0,behavior:'smooth'});">
      <span class="mark"><span class="dot"></span>DESIGN ENCYCLOPEDIA</span>
      <span class="byline">CONCEPT ART &amp; ARCHITECTURE REFERENCE</span>
    </a>
    <div class="nav-search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search" placeholder="Search terms, definitions…" autocomplete="off">
    </div>
    <span class="nav-count" id="navCount"></span>
  </div>
</header>

<div class="controls">
  <div class="wrap controls-row">
    <div class="filters" id="filters"></div>
    <div class="sortgroup">
      <span class="mono-label">Sort</span>
      <div class="sortbtns" id="sortBtns"></div>
      <button class="shuffle-btn" id="shuffleBtn" hidden>⟲ Shuffle</button>
      <span class="divider"></span>
      <button class="viewtab" id="briefTabBtn">Brief Builder</button>
    </div>
  </div>
</div>

<main>
  <div class="wrap">
    <div class="grid" id="grid"></div>
  </div>
</main>

<section class="briefbuilder wrap" id="briefBuilder" hidden>
  <div class="brief-card">
    <div class="mono-label">Random Design Brief</div>
    <div class="brief-text" id="briefText">—</div>
    <div class="brief-actions">
      <button class="brief-btn" id="briefGenerate">Generate Brief</button>
      <button class="brief-btn ghost" id="briefCopy">Copy</button>
    </div>
    <p class="brief-note mono-label">Built only from words in this encyclopedia</p>
  </div>
  <div class="brief-history" id="briefHistory"></div>
</section>

<footer>
  <div class="wrap foot">
    <span class="foot-label">DESIGN ENCYCLOPEDIA</span>
    <span class="foot-copy">A personal reference, not a public archive. Add or edit entries in <code>data.js</code>.</span>
  </div>
</footer>

<div id="tooltip">
  <span class="cat"></span>
  <span class="term"></span>
  <span class="def"></span>
</div>

<!-- LIGHTBOX -->
<div class="lb" id="lb">
  <button class="lb-close" id="lbClose">Esc ✕</button>
  <div class="lb-inner">
    <div class="lb-bar">
      <div>
        <a class="cat" id="lbCat" href="#"></a>
        <div class="t" id="lbTitle">Term</div>
      </div>
      <div class="lb-nav">
        <button class="lb-btn" id="lbPrev">←</button>
        <button class="lb-btn" id="lbNext">→</button>
      </div>
    </div>
    <div class="lb-stage">
      <div class="def" id="lbDef"></div>
    </div>
    <div class="lb-related" id="lbRelatedWrap">
      <div class="h mono-label">Same category</div>
      <div class="chips" id="lbRelated"></div>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script>
  const TERMS = window.TERMS || [];
  const CATEGORIES = window.CATEGORIES || [];
  const catLabel = Object.fromEntries(CATEGORIES.map(c => [c.key, c.label]));

  // Evenly-spaced hues around the same accent formula, one per category, for quick visual scanning.
  const CAT_HUES = {};
  CATEGORIES.forEach((c, i) => { CAT_HUES[c.key] = Math.round((62 + i * (360 / CATEGORIES.length)) % 360); });
  function catColor(key) { return `oklch(0.76 0.12 ${CAT_HUES[key] ?? 62})`; }

  let activeCat = 'all';
  let query = '';
  let sortMode = 'alpha'; // 'alpha' | 'date' | 'random'
  let randomOrder = null; // slug -> rank, set on first random sort or shuffle
  let visible = [];

  const grid = document.getElementById('grid');
  const filtersEl = document.getElementById('filters');
  const sortBtnsEl = document.getElementById('sortBtns');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const navCount = document.getElementById('navCount');
  const searchInput = document.getElementById('search');
  const tooltip = document.getElementById('tooltip');

  function countFor(catKey) {
    return catKey === 'all' ? TERMS.length : TERMS.filter(t => t.cat === catKey).length;
  }

  function renderFilters() {
    const all = [{ key: 'all', label: 'All' }, ...CATEGORIES];
    filtersEl.innerHTML = all.map(c => `
      <button class="filter${c.key === activeCat ? ' active' : ''}" data-cat="${c.key}" style="--cat-color:${catColor(c.key)}">
        <span class="fdot"></span>${c.label}<span class="c">${countFor(c.key)}</span>
      </button>
    `).join('');
    filtersEl.querySelectorAll('.filter').forEach(btn => {
      btn.addEventListener('click', () => {
        activeCat = btn.dataset.cat;
        renderFilters();
        renderGrid();
      });
    });
  }

  function shuffle() {
    const arr = TERMS.map(t => t.slug);
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    randomOrder = new Map(arr.map((slug, i) => [slug, i]));
  }

  function renderSortBtns() {
    const modes = [{ key: 'alpha', label: 'A–Z' }, { key: 'date', label: 'Date Added' }, { key: 'random', label: 'Random' }];
    sortBtnsEl.innerHTML = modes.map(m => `<button data-sort="${m.key}" class="${sortMode === m.key && view === 'browse' ? 'active' : ''}">${m.label}</button>`).join('');
    sortBtnsEl.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        sortMode = btn.dataset.sort;
        if (sortMode === 'random' && !randomOrder) shuffle();
        shuffleBtn.hidden = sortMode !== 'random';
        setView('browse');
      });
    });
  }
  shuffleBtn.addEventListener('click', () => { shuffle(); renderGrid(); });

  /* ---- View toggle: Browse Terms <-> Brief Builder ---- */
  let view = 'browse';
  const briefTabBtn = document.getElementById('briefTabBtn');
  const briefBuilderEl = document.getElementById('briefBuilder');
  const mainEl = document.querySelector('main');
  function setView(next) {
    view = next;
    const isBrief = view === 'brief';
    mainEl.hidden = isBrief;
    filtersEl.hidden = isBrief;
    briefBuilderEl.hidden = !isBrief;
    briefTabBtn.classList.toggle('active', isBrief);
    if (isBrief && briefText.textContent === '—') generateBrief();
    renderSortBtns();
    if (!isBrief) renderGrid();
  }
  briefTabBtn.addEventListener('click', () => setView('brief'));

  function sortList(list) {
    if (sortMode === 'alpha') return list.slice().sort((a, b) => a.term.localeCompare(b.term));
    if (sortMode === 'date') return list.slice().sort((a, b) => a.order - b.order);
    if (!randomOrder) shuffle();
    return list.slice().sort((a, b) => (randomOrder.get(a.slug) ?? 0) - (randomOrder.get(b.slug) ?? 0));
  }

  function matches(t) {
    if (activeCat !== 'all' && t.cat !== activeCat) return false;
    if (!query) return true;
    const q = query.toLowerCase();
    return t.term.toLowerCase().includes(q) || t.def.toLowerCase().includes(q);
  }

  function renderGrid() {
    visible = sortList(TERMS.filter(matches));
    navCount.innerHTML = `Showing <b>${visible.length}</b> of ${TERMS.length}`;
    if (!visible.length) {
      grid.innerHTML = `<div class="empty">No terms match “${query}”</div>`;
      return;
    }
    grid.innerHTML = visible.map((t, i) => `
      <div class="term-cell" data-i="${i}" style="--cat-color:${catColor(t.cat)}">
        <div class="t">${t.term}</div>
      </div>
    `).join('');
  }

  grid.addEventListener('click', e => {
    const cell = e.target.closest('.term-cell');
    if (cell) openLb(+cell.dataset.i);
  });

  /* ---- Hover tooltip (desktop only; mobile/touch falls back to tap → lightbox) ---- */
  grid.addEventListener('mouseover', e => {
    const cell = e.target.closest('.term-cell');
    if (!cell) return;
    const t = visible[+cell.dataset.i];
    tooltip.querySelector('.cat').textContent = catLabel[t.cat] || t.cat;
    tooltip.querySelector('.term').textContent = t.term;
    tooltip.querySelector('.def').textContent = t.def;
    tooltip.style.setProperty('--cat-color', catColor(t.cat));
    const rect = cell.getBoundingClientRect();
    tooltip.classList.remove('show');
    const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
    let left = rect.left;
    let top = rect.bottom + 8;
    if (left + tw > window.innerWidth - 12) left = window.innerWidth - tw - 12;
    if (left < 12) left = 12;
    if (top + th > window.innerHeight - 12) top = rect.top - th - 8;
    if (top < 12) top = 12;
    tooltip.style.left = left + 'px';
    tooltip.style.top = top + 'px';
    requestAnimationFrame(() => tooltip.classList.add('show'));
  });
  grid.addEventListener('mouseout', e => {
    if (e.target.closest('.term-cell')) tooltip.classList.remove('show');
  });
  window.addEventListener('scroll', () => tooltip.classList.remove('show'), { passive: true });

  searchInput.addEventListener('input', () => {
    query = searchInput.value.trim();
    renderGrid();
  });

  /* ---- Brief Builder: random 3-5 word design briefs, built only from terms above ---- */
  // A handful of terms in the list already read as verbs/adjectives on their own (no new
  // words invented, no inflections changed) — everything else is treated as a noun.
  const BRIEF_VERB_STRS = new Set(['Congeal', 'Repair', 'Exploring', 'Salvaging', 'Terraforming', 'Overbuild', 'Shipbreaking']);
  const BRIEF_ADJ_STRS = new Set(['Ancient', 'Impenetrable', 'Spiky', 'Retractable', 'Tropical']);
  const briefVerbs = TERMS.filter(t => BRIEF_VERB_STRS.has(t.term));
  const briefAdjs = TERMS.filter(t => BRIEF_ADJ_STRS.has(t.term));
  const briefNouns = TERMS.filter(t => !BRIEF_VERB_STRS.has(t.term) && !BRIEF_ADJ_STRS.has(t.term));

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)].term; }
  function article(word) { return /^[aeiou]/i.test(word) ? 'an' : 'a'; }

  const BRIEF_TEMPLATES = [
    () => `${pick(briefVerbs)} the ${pick(briefNouns)}`,
    () => `${pick(briefVerbs)} the ${pick(briefAdjs)} ${pick(briefNouns)}`,
    () => `${pick(briefAdjs)} ${pick(briefNouns)}`,
    () => { const n = pick(briefNouns); return `${pick(briefVerbs)} ${article(n)} ${n} in the ${pick(briefNouns)}`; },
    () => `${pick(briefNouns)} of the ${pick(briefNouns)}`,
  ];

  const briefText = document.getElementById('briefText');
  const briefHistoryEl = document.getElementById('briefHistory');
  let briefHistory = [];

  function generateBrief() {
    const text = BRIEF_TEMPLATES[Math.floor(Math.random() * BRIEF_TEMPLATES.length)]();
    briefText.textContent = text;
    briefHistory.unshift(text);
    briefHistory = briefHistory.slice(0, 6);
    briefHistoryEl.innerHTML = briefHistory.slice(1).map(h => `<div class="item">${h}</div>`).join('');
  }
  document.getElementById('briefGenerate').addEventListener('click', generateBrief);
  document.getElementById('briefCopy').addEventListener('click', () => {
    navigator.clipboard?.writeText(briefText.textContent).catch(() => {});
  });

  renderFilters();
  renderSortBtns();
  renderGrid();

  /* ---- Lightbox ---- */
  const lb = document.getElementById('lb');
  let cur = 0;
  function openLb(i) {
    cur = i;
    fillLb();
    lb.classList.add('open');
    lb.scrollTop = 0;
    document.body.style.overflow = 'hidden';
  }
  function fillLb() {
    const t = visible[cur];
    document.getElementById('lbTitle').textContent = t.term;
    document.getElementById('lb').querySelector('.lb-inner').style.setProperty('--cat-color', catColor(t.cat));
    const catEl = document.getElementById('lbCat');
    catEl.textContent = catLabel[t.cat] || t.cat;
    catEl.onclick = (e) => {
      e.preventDefault();
      activeCat = t.cat;
      closeLb();
      renderFilters();
      renderGrid();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    document.getElementById('lbDef').textContent = t.def;

    const related = TERMS.filter(o => o.cat === t.cat && o.slug !== t.slug).slice(0, 12);
    const relatedWrap = document.getElementById('lbRelatedWrap');
    const relatedEl = document.getElementById('lbRelated');
    if (related.length) {
      relatedWrap.style.display = '';
      relatedEl.innerHTML = related.map(r => `<button class="chip" data-slug="${r.slug}">${r.term}</button>`).join('');
      relatedEl.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const idx = visible.findIndex(v => v.slug === chip.dataset.slug);
          if (idx >= 0) { openLb(idx); return; }
          const full = TERMS.findIndex(v => v.slug === chip.dataset.slug);
          if (full >= 0) {
            activeCat = TERMS[full].cat;
            query = '';
            searchInput.value = '';
            renderFilters();
            renderGrid();
            const newIdx = visible.findIndex(v => v.slug === chip.dataset.slug);
            if (newIdx >= 0) openLb(newIdx);
          }
        });
      });
    } else {
      relatedWrap.style.display = 'none';
    }
  }
  function closeLb() { lb.classList.remove('open'); document.body.style.overflow = ''; }
  function nav(d) { cur = (cur + d + visible.length) % visible.length; fillLb(); }

  document.getElementById('lbClose').addEventListener('click', closeLb);
  document.getElementById('lbPrev').addEventListener('click', () => nav(-1));
  document.getElementById('lbNext').addEventListener('click', () => nav(1));
  lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') closeLb();
    if (e.key === 'ArrowLeft') nav(-1);
    if (e.key === 'ArrowRight') nav(1);
  });
</script>

</body>
</html>
